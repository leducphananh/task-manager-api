services:
  # ----------------------------------------------------
  # Service 1: PostgreSQL Database
  # ----------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: task_manager_db
    restart: always
    environment:
      POSTGRES_USER: anhldp
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: task_manager
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U anhldp -d task_manager']
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------------------
  # Service 2: FastAPI Application
  # ----------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task_manager_api
    restart: always
    environment:
      # Kết nối sang service db bằng hostname là "db"
      DATABASE_URL: postgresql://anhldp:123456@db:5432/task_manager
      SECRET_KEY: super_secret_docker_key_1234567890_change_me
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - '8000:8000'
    # Mount thư mục hiện tại vào /app để hỗ trợ tính năng hot-reload khi dev
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  postgres_data:
